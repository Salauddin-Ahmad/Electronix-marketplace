<script type="importmap">

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

// ============================================================
// SCENE
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07101d);
scene.fog = new THREE.Fog(0x07101d, 20, 55);

// ============================================================
// CAMERA
// ============================================================

    42,
    window.innerWidth / window.innerHeight,
    0.1,

camera.lookAt(0, 0, 0);

// RENDERER
// ============================================================

    antialias: true,
    powerPreference: "high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Make the canvas focusable so keyboard activation is possible.

renderer.domElement.setAttribute("aria-label", "Interactive electrical circuit");
document.body.appendChild(renderer.domElement);

// ============================================================
// BLOOM
// ============================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.05,
    0.62,
    0.035
);
composer.addPass(bloom);

// ============================================================
// LIGHTING
// ============================================================
scene.add(new THREE.HemisphereLight(0x7fa9ff, 0x09111e, 5.0));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(1, 20, 14);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x1A6FD4, 9, 80);
fillLight.position.set(0, 3.5, 2);
scene.add(fillLight);

const magentaLight = new THREE.PointLight(0xff1bd8, 10, 20);
magentaLight.position.set(0, 3.5, 0);
scene.add(magentaLight);

// ============================================================
// FLOOR
// ============================================================
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(46, 34),
    new THREE.MeshStandardMaterial({
        color: 0x0c1828,
        metalness: 0.50,
        roughness: 0.30
    })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.86;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(36, 36, 0x183b69, 0x102644);
grid.position.y = -0.84;
grid.material.transparent = true;
grid.material.opacity = 0.54;
scene.add(grid);

// ============================================================
// MATERIALS
// ============================================================
const chrome = new THREE.MeshPhysicalMaterial({
    color: 0xa8bde3,
    metalness: 1,
    roughness: 0.14,
    clearcoat: 1,
    clearcoatRoughness: 0.08
});

const darkChrome = new THREE.MeshPhysicalMaterial({
    color: 0x182334,
    metalness: 1.8,
    roughness: 0.2,
    clearcoat: 6
});

const blueMetal = new THREE.MeshPhysicalMaterial({
    color: 0x183a69,
    metalness: 0.5,
    roughness: 0.2
});

const black = new THREE.MeshStandardMaterial({
    color: 0x0b101b,
    metalness: 0.12,
    roughness: 0.25
});

// ============================================================
// HELPERS: STRAIGHT WIRES
// ============================================================
const WIRE_Y = 0.0;
const WIRE_RADIUS = 0.16;
const GLOW_RADIUS = 0.045;
const segments = [];
const cornerGlowMeshes = [];

function addWireSegment(start, end) {
    const s = new THREE.Vector3(...start);
    const e = new THREE.Vector3(...end);
    const mid = s.clone().add(e).multiplyScalar(0.5);
    const length = s.distanceTo(e);

    const geometry = new THREE.CylinderGeometry(
        WIRE_RADIUS,
        WIRE_RADIUS,
        length,
        18
    );

    const mesh = new THREE.Mesh(geometry, chrome);
    mesh.position.copy(mid);

    const direction = e.clone().sub(s);
    const up = new THREE.Vector3(0, 1, 0);
    mesh.quaternion.setFromUnitVectors(up, direction.normalize());
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    // Bright inner energy rail — color/material unchanged.
    const glowGeometry = new THREE.CylinderGeometry(
        GLOW_RADIUS,
        GLOW_RADIUS,
        length,
        56
    );
    const glowMaterial = new THREE.MeshBasicMaterial({
        color: 0x1496ff,
        transparent: true,
        opacity: 0.92
    });
    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
    glow.position.copy(mid);
    glow.quaternion.copy(mesh.quaternion);
    scene.add(glow);

    segments.push({ start: s, end: e, mesh, glow, glowMaterial });
}

// ============================================================
// CIRCUIT LAYOUT — ONLY STRAIGHT LINES + 90° CORNERS
// ============================================================
const LEFT_X = -7.2;
const RIGHT_X = 7.2;
const TOP_Z = -3.9;
const BOTTOM_Z = 3.9;
const BATTERY_GAP_TOP = -2.45;
const BATTERY_GAP_BOTTOM = 2.45;
const RESISTOR_LEFT = -1.8;
const RESISTOR_RIGHT = 1.8;
const SWITCH_LEFT = -1.65;
const SWITCH_RIGHT = 1.65;
const LED_GAP_TOP = -0.85;
const LED_GAP_BOTTOM = 0.85;

addWireSegment([LEFT_X, WIRE_Y, TOP_Z], [RESISTOR_LEFT, WIRE_Y, TOP_Z]);
addWireSegment([RESISTOR_RIGHT, WIRE_Y, TOP_Z], [RIGHT_X, WIRE_Y, TOP_Z]);
addWireSegment([RIGHT_X, WIRE_Y, TOP_Z], [RIGHT_X, WIRE_Y, LED_GAP_TOP]);
addWireSegment([RIGHT_X, WIRE_Y, LED_GAP_BOTTOM], [RIGHT_X, WIRE_Y, BOTTOM_Z]);
addWireSegment([RIGHT_X, WIRE_Y, BOTTOM_Z], [SWITCH_RIGHT, WIRE_Y, BOTTOM_Z]);
addWireSegment([SWITCH_LEFT, WIRE_Y, BOTTOM_Z], [LEFT_X, WIRE_Y, BOTTOM_Z]);
addWireSegment([LEFT_X, WIRE_Y, BOTTOM_Z], [LEFT_X, WIRE_Y, BATTERY_GAP_BOTTOM]);
addWireSegment([LEFT_X, WIRE_Y, BATTERY_GAP_TOP], [LEFT_X, WIRE_Y, TOP_Z]);

// ============================================================
// CORNER CAPS
// ============================================================
const cornerPositions = [
    [LEFT_X, TOP_Z],
    [RIGHT_X, TOP_Z],
    [RIGHT_X, BOTTOM_Z],
    [LEFT_X, BOTTOM_Z]
];

const cornerGeometry = new THREE.SphereGeometry(0.18, 24, 20);

for (const [x, z] of cornerPositions) {
    const cap = new THREE.Mesh(cornerGeometry, chrome);
    cap.position.set(x, WIRE_Y, z);
    cap.castShadow = true;
    scene.add(cap);

    const glowMaterial = new THREE.MeshBasicMaterial({
        color: 0x32b8ff,
        transparent: true,
        opacity: 1
    });
    const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.075, 16, 16),
        glowMaterial
    );
    glow.position.set(x, WIRE_Y, z);
    scene.add(glow);
    cornerGlowMeshes.push(glow);
}

// ============================================================
// BATTERY — HIGH VISIBILITY
// ============================================================
const battery = new THREE.Group();
battery.position.set(LEFT_X, 0.75, 0);
scene.add(battery);

const batteryBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.92, 0.92, 3.6, 48),
    new THREE.MeshPhysicalMaterial({
        color: 0x0d1523,
        metalness: 2.7,
        roughness: 1,
        clearcoat: 1
    })
);
batteryBody.castShadow = true;
battery.add(batteryBody);

const batteryTopRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.97, 0.97, 0.24, 48),
    new THREE.MeshBasicMaterial({ color: 0xd21dff })
);
batteryTopRing.position.y = 1.42;
battery.add(batteryTopRing);

const batteryBottomRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.97, 0.97, 0.22, 48),
    new THREE.MeshBasicMaterial({ color: 0x0b8dff })
);
batteryBottomRing.position.y = -1.42;
battery.add(batteryBottomRing);

const positive = new THREE.Mesh(
    new THREE.CylinderGeometry(0.36, 0.76, 0.10, 20),
    chrome
);
positive.position.y = 1.87;
battery.add(positive);

const negative = new THREE.Mesh(
    new THREE.CylinderGeometry(0.30, 0.30, 0.15, 32),
    chrome
);
negative.position.y = -1.86;
battery.add(negative);

addWireSegment([LEFT_X, WIRE_Y, BATTERY_GAP_TOP], [LEFT_X, WIRE_Y, -1.82]);
addWireSegment([LEFT_X, WIRE_Y, 1.82], [LEFT_X, WIRE_Y, BATTERY_GAP_BOTTOM]);

const batteryGlow = new THREE.PointLight(0x8a2dff, 7, 8);
batteryGlow.position.set(0, 0.6, 0);
battery.add(batteryGlow);

// ============================================================
// RESISTOR — HORIZONTAL AND SHINY
// ============================================================
const resistor = new THREE.Group();
resistor.position.set(0, 0.25, TOP_Z);
scene.add(resistor);

const resistorBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 0.55, 2.6, 48),
    new THREE.MeshPhysicalMaterial({
        color: 0x1a2435,
        metalness: 0.26,
        roughness: 0.17,
        clearcoat: 1
    })
);
resistorBody.rotation.z = Math.PI / 2;
resistorBody.castShadow = true;
resistor.add(resistorBody);

const bands = [
    [0x00a7ff, -0.72],
    [0xff1bc4, -0.22],
    [0x2448ff, 0.28],
    [0xffb83d, 0.72]
];

for (const [color, x] of bands) {
    const band = new THREE.Mesh(
        new THREE.CylinderGeometry(0.565, 0.565, 0.16, 48),
        new THREE.MeshBasicMaterial({ color })
    );
    band.rotation.z = Math.PI / 2;
    band.position.x = x;
    resistor.add(band);
}

const resistorEndL = new THREE.Mesh(
    new THREE.CylinderGeometry(0.38, 0.38, 0.38, 32),
    chrome
);
resistorEndL.rotation.z = Math.PI / 2;
resistorEndL.position.x = -1.45;
resistor.add(resistorEndL);

const resistorEndR = resistorEndL.clone();
resistorEndR.position.x = 1.45;
resistor.add(resistorEndR);

// ============================================================
// LED — VERY VISIBLE
// ============================================================
const led = new THREE.Group();
led.position.set(RIGHT_X, 0.4, 0);
scene.add(led);

const ledBase = new THREE.Mesh(
    new THREE.CylinderGeometry(0.66, 0.76, 0.55, 48),
    chrome
);
ledBase.castShadow = true;
led.add(ledBase);

const ledRing = new THREE.Mesh(
    new THREE.CylinderGeometry(0.52, 0.52, 0.12, 48),
    new THREE.MeshBasicMaterial({ color: 0x138cff })
);
ledRing.position.y = -0.22;
led.add(ledRing);

const ledGlassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x148cff,
    emissive: 0x0479ff,
    emissiveIntensity: 2,
    transparent: true,
    opacity: 0.9,
    roughness: 0.05,
    metalness: 0.05,
    transmission: 0.92,
    clearcoat: 1
});
const ledGlass = new THREE.Mesh(
    new THREE.SphereGeometry(0.78, 48, 32),
    ledGlassMaterial
);
ledGlass.scale.y = 1.20;
ledGlass.position.y = 0.66;
led.add(ledGlass);

const ledCore = new THREE.Mesh(
    new THREE.SphereGeometry(0.39, 12, 24),
    new THREE.MeshBasicMaterial({ color: 0xd9ffff })
);
ledCore.position.y = 0.58;
led.add(ledCore);

const ledLight = new THREE.PointLight(0x1498ff, 18, 11);
ledLight.position.y = 0.7;
led.add(ledLight);

// ============================================================
// SWITCH — VISIBLE METALLIC BASE
// ============================================================
const switchGroup = new THREE.Group();
switchGroup.position.set(0, 0.26, BOTTOM_Z);
scene.add(switchGroup);

const switchBase = new THREE.Mesh(
    new THREE.BoxGeometry(3.15, 0.65, 1.85),
    darkChrome
);
switchBase.position.y = 0.0;
switchBase.castShadow = true;
switchGroup.add(switchBase);

const switchPlate = new THREE.Mesh(
    new THREE.BoxGeometry(2.7, 0.09, 1.46),
    chrome
);
switchPlate.position.y = 0.37;
switchGroup.add(switchPlate);

const magentaGlowMaterial = new THREE.MeshBasicMaterial({
    color: 0xc51cff,
    transparent: true,
    opacity: 0.62
});
const magentaGlow = new THREE.Mesh(
    new THREE.BoxGeometry(3.12, 0.07, 1.86),
    magentaGlowMaterial
);
magentaGlow.position.y = -0.34;
switchGroup.add(magentaGlow);

const switchSocket = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.58, 0.22, 36),
    chrome
);
switchSocket.position.y = 0.55;
switchGroup.add(switchSocket);

const lever = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.19, 1.65, 28),
    chrome
);
lever.position.set(0, 1.34, 0);
lever.rotation.z = -0.42;
lever.castShadow = true;
switchGroup.add(lever);

// ============================================================
// CLICKABLE SWITCH STATE
// ============================================================
const switchState = {
    on: true,
    targetPower: 1,
    power: 1,
    onRotation: -0.42,
    offRotation: 0.42
};

// Electrical illumination targets. These are driven only by switch power;
// the scene/floor/theme lighting remains untouched when the circuit is OFF.
const electricalVisual = {
    wireGlow: 0.92,
    cornerGlow: 1.0,
    ledRing: 1.0,
    ledCore: 1.0,
    ledGlassEmission: 2.0,
    batteryGlow: 1.0,
    switchAccent: 1.0
};

function setCircuitState(isOn) {
    switchState.on = isOn;
    switchState.targetPower = isOn ? 1 : 0;
}

function toggleCircuit() {
    setCircuitState(!switchState.on);
}

// ============================================================
// ENERGY PULSES — FEWER, BIGGER, CLEANER
// ============================================================
const electronCount = 13;
const electrons = [];

const electronCoreMat = new THREE.MeshBasicMaterial({
    color: 0xe7ffff
});

const electronGlowMat = new THREE.MeshBasicMaterial({
    color: 0x008cff,
    transparent: true,
    opacity: 0.48
});

const electronHaloMat = new THREE.MeshBasicMaterial({
    color: 0x00d9ff,
    transparent: true,
    opacity: 0.11
});

function buildCircuitSample(distanceT) {
    const corners = [
        new THREE.Vector3(LEFT_X, 0, TOP_Z),
        new THREE.Vector3(RESISTOR_LEFT, 0, TOP_Z),
        new THREE.Vector3(RESISTOR_RIGHT, 0, TOP_Z),
        new THREE.Vector3(RIGHT_X, 0, TOP_Z),
        new THREE.Vector3(RIGHT_X, 0, LED_GAP_TOP),
        new THREE.Vector3(RIGHT_X, 0, LED_GAP_BOTTOM),
        new THREE.Vector3(RIGHT_X, 0, BOTTOM_Z),
        new THREE.Vector3(SWITCH_RIGHT, 0, BOTTOM_Z),
        new THREE.Vector3(SWITCH_LEFT, 0, BOTTOM_Z),
        new THREE.Vector3(LEFT_X, 0, BOTTOM_Z),
        new THREE.Vector3(LEFT_X, 0, BATTERY_GAP_BOTTOM),
        new THREE.Vector3(LEFT_X, 0, BATTERY_GAP_TOP),
        new THREE.Vector3(LEFT_X, 0, TOP_Z)
    ];

    const lengths = [];
    let total = 0;

    for (let i = 0; i < corners.length - 1; i++) {
        const len = corners[i].distanceTo(corners[i + 1]);
        lengths.push(len);
        total += len;
    }

    let target = (((distanceT % 1) + 1) % 1) * total;

    for (let i = 0; i < lengths.length; i++) {
        if (target <= lengths[i]) {
            const a = corners[i];
            const b = corners[i + 1];
            return a.clone().lerp(b, target / lengths[i]);
        }
        target -= lengths[i];
    }

    return corners[0].clone();
}

for (let i = 0; i < electronCount; i++) {
    const g = new THREE.Group();

    const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 14, 90),
        electronCoreMat
    );

    const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 24, 20),
        electronGlowMat
    );

    const halo = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 20, 96),
        electronHaloMat
    );

    g.add(halo);
    g.add(glow);
    g.add(core);

    g.userData.t = i / electronCount;
    g.userData.speed = 0.0155 + Math.random() * 0.003;
    g.userData.phase = Math.random() * Math.PI * 2;
    electrons.push(g);
    scene.add(g);
}

// ============================================================
// ELECTRON TRAILS
// ============================================================
const trailCount = 15;
const trails = [];

for (let i = 0; i < trailCount; i++) {
    const positions = new Float32Array(12 * 3);
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
    );

    const trailMaterial = new THREE.LineBasicMaterial({
        color: 0x008fff,
        transparent: true,
        opacity: 0.23
    });

    const line = new THREE.Line(geometry, trailMaterial);
    scene.add(line);

    trails.push({
        line,
        positions,
        material: trailMaterial,
        history: new Array(12).fill(0).map(() => new THREE.Vector3())
    });
}

// ============================================================
// SMALL AMBIENT PARTICLES
// ============================================================
const starCount = 100;
const starPositions = new Float32Array(starCount * 3);

for (let i = 0; i < starCount; i++) {
    starPositions[i * 3] = (Math.random() - 0.5) * 28;
    starPositions[i * 3 + 1] = 0.3 + Math.random() * 3;
    starPositions[i * 3 + 2] = (Math.random() - 0.5) * 20;
}

const starsMaterial = new THREE.PointsMaterial({
    color: 0x4aa8ff,
    size: 0.015,
    transparent: true,
    opacity: 3
});

const stars = new THREE.Points(
    new THREE.BufferGeometry().setAttribute(
        "position",
        new THREE.BufferAttribute(starPositions, 3)
    ),
    starsMaterial
);
scene.add(stars);

// ============================================================
// MOUSE PARALLAX
// ============================================================
const mouse = { x: 0, y: 0 };
window.addEventListener("pointermove", (event) => {
    mouse.x = event.clientX / window.innerWidth - 0.5;
    mouse.y = event.clientY / window.innerHeight - 0.5;
});

// ============================================================
// CLICK / TOUCH / KEYBOARD INTERACTION
// OFF affects only electrical activity/illumination; environment and metal scene lighting stay ON.
// ============================================================
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const switchHitObjects = [switchBase, switchPlate, magentaGlow, switchSocket, lever];

function updatePointerNDC(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNDC.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
}

function isPointerOverSwitch(event) {
    updatePointerNDC(event);
    raycaster.setFromCamera(pointerNDC, camera);
    for (const object of switchHitObjects) {
        if (raycaster.intersectObject(object, true).length > 0) return true;
    }
    return false;
}

renderer.domElement.addEventListener("pointerdown", (event) => {
    if (isPointerOverSwitch(event)) {
        toggleCircuit();
        renderer.domElement.focus();
    }
});

renderer.domElement.addEventListener("pointermove", (event) => {
    renderer.domElement.style.cursor = isPointerOverSwitch(event) ? "pointer" : "default";
});

renderer.domElement.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleCircuit();
    }
});

// ============================================================
// ANIMATION
// ============================================================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;

    // Smoothly transition circuit power instead of snapping effects.
    switchState.power +=
        (switchState.targetPower - switchState.power) * Math.min(1, delta * 12);

    // Smooth switch lever motion.
    const targetRotation = switchState.on
        ? switchState.onRotation
        : switchState.offRotation;
    lever.rotation.z += (targetRotation - lever.rotation.z) * Math.min(1, delta * 10);

    // Current flow: motion only advances while the circuit is ON.
    electrons.forEach((electron) => {
        if (switchState.on) {
            electron.userData.t += electron.userData.speed * 0.09;
            if (electron.userData.t >= 1) {
                electron.userData.t -= 1;
            }
        }

        const p = buildCircuitSample(electron.userData.t);
        electron.position.copy(p);
        electron.position.y = 0.17;

        const pulse =
            1 + Math.sin(time * 3.2 + electron.userData.phase) * 0.1;

        electron.scale.setScalar(pulse * switchState.power);
    });

    // Trails follow selected electrons and fade with circuit power.
    trails.forEach((trail, trailIndex) => {
        const source = electrons[(trailIndex * 2) % electrons.length];
        const t = source.userData.t;

        trail.history[0].copy(buildCircuitSample(t));
        trail.history[0].y = 0.11;

        for (let j = 1; j < trail.history.length; j++) {
            const oldT = t - j * 0.004;
            trail.history[j].copy(buildCircuitSample(oldT));
            trail.history[j].y = 0.11;
        }

        for (let j = 0; j < trail.history.length; j++) {
            trail.positions[j * 3] = trail.history[j].x;
            trail.positions[j * 3 + 1] = trail.history[j].y;
            trail.positions[j * 3 + 2] = trail.history[j].z;
        }

        // Motion stops immediately when OFF, while the visible trail fades smoothly.
        trail.material.opacity = 0.23 * switchState.power;
        trail.line.geometry.attributes.position.needsUpdate = true;
    });

    // Active electrical illumination only. Environmental/theme lights stay ON.
    segments.forEach((segment) => {
        segment.glowMaterial.opacity = electricalVisual.wireGlow * switchState.power;
    });

    cornerGlowMeshes.forEach((mesh) => {
        mesh.material.opacity = electricalVisual.cornerGlow * switchState.power;
    });

    // LED ring is an electrical indicator, so it fades with the circuit.
    ledRing.material.opacity = switchState.power;
    ledRing.material.transparent = true;

    // LED light, lens emission and core illumination.
    const ledPulse = 1 + (Math.sin(time * 2.7) + 1) * 0.18;
    ledLight.intensity = 2 * ledPulse * switchState.power;
    ledCore.scale.setScalar(
        (0.86 + Math.sin(time * 3) * 0.10) * switchState.power
    );
    ledGlassMaterial.emissiveIntensity = electricalVisual.ledGlassEmission * switchState.power;

    // Battery's purple local light is also electrical illumination.
    batteryGlow.intensity =
        (30 + Math.sin(time * 2.0) * 1.5) * switchState.power;

    // Keep the switch's physical magenta trim as part of the theme,
    // but reduce it heavily when the circuit is OFF.
    magentaGlowMaterial.opacity =
        (0.62 + Math.sin(time * 2.2) * 0.10) *
        (0.15 + 0.85 * switchState.power);

    // Ambient particles.
    stars.rotation.y = time * 0.008;

    // Subtle camera parallax.
    const targetX = mouse.x * 1.25;
    const targetZ = 18.5 + mouse.y * 1.0;
    camera.position.x += (targetX - camera.position.x) * 0.03;
    camera.position.z += (targetZ - camera.position.z) * 0.03;
    camera.lookAt(0, 0, 0);

    composer.render();
}

animate();

// ============================================================
// RESIZE
// ============================================================
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
